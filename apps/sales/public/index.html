<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灵兔电商销售台 · 经营与对账</title>
  <link rel="stylesheet" href="/vendor/tabulator/css/tabulator.min.css">
  <link rel="stylesheet" href="/ui/tokens.css"><link rel="stylesheet" href="/ui/base.css"><link rel="stylesheet" href="/ui/components.css"><link rel="stylesheet" href="/ui/vendor/tabulator.css"><link rel="stylesheet" href="/ui/vendor/flatpickr.css"><link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sales-workspace.css">
  <link rel="stylesheet" href="/task-center.css">
  <link rel="stylesheet" href="/personnel.css">
  <script defer src="/vendor/chart/chart.umd.js"></script>
  <script defer src="/vendor/tabulator/js/tabulator.min.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/integration-links.js"></script>
<link rel="stylesheet" href="./loading-screen.css"><script type="module" src="./loading-screen-auto.mjs"></script></head>
<body><div class="lt-shell">
  <aside class="lt-sidebar">
    <a class="brand lt-brand" href="#operations"><span class="lt-brand__mark">灵</span><span>灵兔电商销售台<small>每一笔生意，都有依据</small></span></a>
    <div class="nav-label">每月工作</div>
    <nav class="lt-nav" aria-label="销售台导航">
      <button class="lt-nav__item" data-nav="operations"><svg aria-hidden="true"><use href="/ui/icons.svg#overview"/></svg>运营总览</button>
      <button class="lt-nav__item" data-nav="reconciliation"><svg aria-hidden="true"><use href="/ui/icons.svg#sales"/></svg>资金对账</button>
      <button class="lt-nav__item" data-nav="freight"><svg aria-hidden="true"><use href="/ui/icons.svg#purchase"/></svg>运费</button>
      <a id="pending-edits-link" href="/integration-edits.html" hidden><svg aria-hidden="true"><use href="/ui/icons.svg#edit"/></svg>待确认修改 <span id="pending-edits-count" class="nav-count"></span></a>
    </nav>
    <div class="sidebar-bottom">
      <div id="personnel-status" class="personnel-status" hidden><strong id="personnel-name"></strong><button class="btn" type="button" id="personnel-switch">切换身份</button></div>
      <nav class="lt-nav" aria-label="管理"><button class="lt-nav__item" data-nav="sources"><svg aria-hidden="true"><use href="/ui/icons.svg#settings"/></svg>业务管理</button></nav>
      <div class="sidebar-foot"><span class="live-dot"></span>本机保存<small>独立数据 · 原件留存 · 审计历史</small></div>
    </div>
  </aside>
  <div class="lt-main">
    <header class="topbar lt-topbar">
      <div><div class="eyebrow">LINGTU / E-COMMERCE SALES DESK</div><h1 id="page-title">运营总览</h1></div>
      <a id="task-return" class="task-return" href="#operations" hidden>返回运营总览 <span aria-hidden="true">↗</span></a>
      <span id="lock-status" hidden></span>
    </header>
    <div id="demo-banner" hidden class="notice warning">演示验证环境 · 全部为合成测试数据，与正式账本隔离</div>
    <div class="toolbar">
      <div class="lt-period" data-period-picker data-picker="sales-main" data-grains="day,month,year" data-stepper="true" data-label="统计时间" data-store-key="sales-main"></div>
      <label class="inline-label">店铺<select id="shop" aria-label="筛选店铺"><option value="all">全部店铺与渠道</option></select></label>
      <label class="inline-label" id="freight-channel-label" hidden>类型<select id="freight-channel" aria-label="筛选运费类型"><option value="all">全部类型</option><option value="warehouse">云仓发货</option><option value="merchant">商家寄件</option><option value="sf">顺丰快递</option></select></label>
      <span class="toolbar-note" id="period-note">业务日期按来源报表记录</span>
    </div>
    <nav id="settings-nav" class="settings-tabs" aria-label="设置功能" hidden></nav>
    <main id="content" class="lt-content"><div class="lt-loading" data-variant="content" role="status" aria-live="polite" aria-busy="true">
  <div class="lt-loading__logo"><img src="./loading-logo.png" alt="" draggable="false"></div>
  <div class="lt-loading__brand">五成电子商务工作台</div>
  <div class="lt-loading__subtitle">销售台</div>
  <progress class="lt-loading__progress" aria-label="正在读取本机数据…"></progress>
  <div class="lt-loading__status">正在读取本机数据…</div>
  <div class="lt-loading__note">正在为您连接电商经营所需的业务能力</div>
</div></main>
    <footer>灵兔电商销售台 · 本机账本 <span>缺失数据不会补零，收款不会重复计入销售额。</span></footer>
  </div></div>
  <dialog id="dialog" class="lt-dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
