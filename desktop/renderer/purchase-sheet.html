<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'">
  <title>采购数据表格</title>
  <link rel="stylesheet" href="vendor/purchase-sheet.css">
  <link rel="stylesheet" href="purchase-sheet.css">
</head>
<body>
  <header class="sheet-actions">
    <button id="save" class="primary" disabled>保存表格</button>
    <button id="reload" disabled>刷新数据</button>
    <button id="filter" disabled>筛选 / 取消筛选</button>
    <button id="export" disabled>导出 Excel</button>
    <button id="history" disabled>历史记录</button>
    <span id="status" role="status" aria-live="polite">正在加载开源表格…</span>
    <details><summary>使用说明</summary><div class="sheet-help">双击单元格编辑；工具栏可设置字体、颜色、数字格式、合并、排序等。支持 Ctrl+C/V、Ctrl+Z/Y、Ctrl+S。底部切换或新增工作表，分析表可写公式。保存只影响当前工作簿，原始采购记录保留。Excel 导出包含数据、公式和基础格式，不保证 WPS 全部高级功能兼容。表格引擎 Univer · Apache-2.0 · 纯本地运行。</div></details>
  </header>
  <main id="sheet" aria-label="采购工作簿"></main>
  <script src="vendor/purchase-sheet.js"></script>
</body>
</html>
