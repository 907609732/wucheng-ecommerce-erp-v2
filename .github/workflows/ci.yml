name: Browser ERP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan secrets with Gitleaks
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern "gitleaks_8.30.1_windows_x64.zip" --output $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          & (Join-Path $toolDir "gitleaks.exe") git --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/purchase/package-lock.json
            apps/sales/package-lock.json
            apps/overview/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix apps/purchase --ignore-scripts
      - run: npm ci --prefix apps/sales --ignore-scripts
      - run: npm ci --prefix apps/overview --ignore-scripts
      - run: npm run check
      - run: npm run sync:approval
      - run: npm test
      - run: npm run test:purchase
      - run: npm run test:sales
      - name: Verify real Windows DPAPI without competing business fixtures
        working-directory: apps/overview
        run: node --test tests/cainiao-auth.test.mjs
      - name: Verify remaining overview business rules
        working-directory: apps/overview
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests/*.test.mjs | Where-Object Name -ne 'cainiao-auth.test.mjs' | ForEach-Object FullName)
          node --test --test-concurrency=2 $tests
          if ($LASTEXITCODE -ne 0) { throw 'Overview business tests failed' }
      - run: npm audit --omit=dev --audit-level=high
