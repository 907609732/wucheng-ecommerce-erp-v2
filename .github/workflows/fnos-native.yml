name: fnOS native FPK
run-name: Native FPK · ${{ github.ref_name }} · ${{ github.sha }}
on:
  workflow_call:
    inputs:
      check_scope:
        description: Test scope for the complete native build
        required: false
        type: string
        default: focused
      build_linux:
        description: Also produce the standalone Linux environment package
        required: false
        type: boolean
        default: false
      build_trial:
        description: Also produce an isolated full-native trial FPK
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      check_scope:
        description: Test scope (full suites or focused native packaging checks)
        type: choice
        options: [full, focused]
        default: full
      build_trial:
        description: Also produce an isolated full-native trial FPK
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fnos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-hook-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject package-owned symlink writes from root diagnostic hook
        run: sudo env ERP_DIAG_BOUNDARY_CI=1 /usr/bin/python3 -I -B tests/fnos-diagnostic-boundary.py
  native:
    needs: diagnostic-hook-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Permit unprivileged namespace sandbox only on ephemeral CI host
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu24.04 additionally restricts unprofiled Chromium userns even
          # inside privileged Docker. This setting is NEVER applied by the FPK.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            prior=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
            echo "ERP_CI_APPARMOR_USERNS_PREVIOUS=$prior" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build on Debian 12, test real package-user namespace sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fnos-output" "$RUNNER_TEMP/fnos-work"
          # Privilege belongs only to this ephemeral test container. The FPK
          # neither uses Docker nor grants Linux capabilities to its package user.
          docker run --rm --init --privileged --security-opt apparmor=unconfined \
            -e GITHUB_RUN_ID -e GITHUB_SHA -e ERP_BUILD_WORK_ROOT=/build \
            -e ERP_CI_CHECK_SCOPE="${{ inputs.check_scope || 'focused' }}" \
            -e ERP_BUILD_LINUX="${{ inputs.build_linux && '1' || '0' }}" \
            -e ERP_BUILD_TRIAL="${{ inputs.build_trial && '1' || '0' }}" \
            -e ERP_LINUX_OUTPUT=/output/linux-x64 \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/fnos-output:/output" \
            -v "$RUNNER_TEMP/fnos-work:/build" -w /src debian:12-slim \
            bash deploy/fnos/ci-native.sh 2>&1 | tee "$RUNNER_TEMP/fnos-output/ci-build.log"
      - name: Verify payload in clean Debian runtime without system graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --privileged --security-opt apparmor=unconfined \
            -e GITHUB_RUN_ID -e GITHUB_SHA -e ERP_BUILD_LINUX="${{ inputs.build_linux && '1' || '0' }}" -e ERP_BUILD_TRIAL="${{ inputs.build_trial && '1' || '0' }}" \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/fnos-output:/output" \
            -v "$RUNNER_TEMP/fnos-work:/build" -w /src debian:12-slim \
            bash deploy/fnos/verify-clean-runtime.sh 2>&1 | tee "$RUNNER_TEMP/fnos-output/clean-runtime.log"
      - name: Restore ephemeral CI host namespace policy
        if: always() && env.ERP_CI_APPARMOR_USERNS_PREVIOUS != ''
        shell: bash
        run: sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$ERP_CI_APPARMOR_USERNS_PREVIOUS"
      - name: Make exported synthetic evidence readable by artifact uploader
        if: always()
        shell: bash
        run: sudo chmod -R a+rX "$RUNNER_TEMP/fnos-output"
      - name: Upload native FPK, diagnostic FPK and verifiable evidence
        if: always() && !inputs.build_linux
        uses: actions/upload-artifact@v4
        with:
          name: fnos-native-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fnos-output/**
            !${{ runner.temp }}/fnos-output/release/*wuchengerptrial*.fpk
            !${{ runner.temp }}/fnos-output/release/trial-*
            !${{ runner.temp }}/fnos-output/release/trial-runtime-evidence/**
            !${{ runner.temp }}/fnos-output/release/clean-trial-evidence/**
            !${{ runner.temp }}/fnos-output/release/trial-xvfb/**
            !${{ runner.temp }}/fnos-output/meson-buildoptions.json
            !${{ runner.temp }}/fnos-output/meson-log.txt
            !${{ runner.temp }}/fnos-output/source-provenance.txt
            !${{ runner.temp }}/fnos-output/SHA256SUMS.txt
            !${{ runner.temp }}/fnos-output/linux-x64/**
            !${{ runner.temp }}/fnos-output/**/*corresponding-source.tar.zst
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload isolated trial FPK and evidence
        if: always() && inputs.build_trial
        uses: actions/upload-artifact@v4
        with:
          name: fnos-trial-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fnos-output/release/*wuchengerptrial*.fpk
            ${{ runner.temp }}/fnos-output/release/trial-SHA256SUMS.txt
            ${{ runner.temp }}/fnos-output/release/trial-PAYLOAD-FILES.txt
            ${{ runner.temp }}/fnos-output/release/trial-PAYLOAD-SHA256SUMS.txt
            ${{ runner.temp }}/fnos-output/release/trial-PAYLOAD-SYMLINKS.txt
            ${{ runner.temp }}/fnos-output/release/trial-artifact-verification.json
            ${{ runner.temp }}/fnos-output/release/trial-packed-verification.json
            ${{ runner.temp }}/fnos-output/release/trial-packed-manifest-verification.json
            ${{ runner.temp }}/fnos-output/release/trial-packed-payload-check.log
            ${{ runner.temp }}/fnos-output/release/trial-source-info.txt
            ${{ runner.temp }}/fnos-output/release/trial-receipt.txt
            ${{ runner.temp }}/fnos-output/release/trial-runtime-evidence/**
            ${{ runner.temp }}/fnos-output/release/clean-trial-evidence/**
            ${{ runner.temp }}/fnos-output/release/trial-MANIFEST-SOURCE.txt
            ${{ runner.temp }}/fnos-output/release/trial-xvfb/**
            ${{ runner.temp }}/fnos-output/release/trial-source-companion.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload unified fnOS delivery package and verifiable evidence
        if: always() && inputs.build_linux
        uses: actions/upload-artifact@v4
        with:
          name: fnos-native-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fnos-output/**
            !${{ runner.temp }}/fnos-output/release/*wuchengerptrial*.fpk
            !${{ runner.temp }}/fnos-output/release/trial-*
            !${{ runner.temp }}/fnos-output/release/trial-runtime-evidence/**
            !${{ runner.temp }}/fnos-output/release/clean-trial-evidence/**
            !${{ runner.temp }}/fnos-output/release/trial-xvfb/**
            !${{ runner.temp }}/fnos-output/linux-x64/**
            !${{ runner.temp }}/fnos-output/release/wuchengerp.fpk
            !${{ runner.temp }}/fnos-output/**/*corresponding-source.tar.zst
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload standalone Linux package and sidecars
        if: success() && inputs.build_linux
        uses: actions/upload-artifact@v4
        with:
          name: environment-linux-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fnos-output/linux-x64/*.tar.gz
            ${{ runner.temp }}/fnos-output/linux-x64/*.tar.gz.sha256
            ${{ runner.temp }}/fnos-output/linux-x64/environment-build.json
            ${{ runner.temp }}/fnos-output/linux-x64/environment-receipt.json
            ${{ runner.temp }}/fnos-output/linux-x64/environment-acceptance.json
            ${{ runner.temp }}/fnos-output/linux-x64/chrome-sandbox.txt
            ${{ runner.temp }}/fnos-output/linux-x64/loaded-libraries.json
            ${{ runner.temp }}/fnos-output/linux-x64/source-companion.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload complete corresponding-source companion
        uses: actions/upload-artifact@v4
        with:
          name: fnos-corresponding-source-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fnos-output/**/*corresponding-source.tar.zst
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
