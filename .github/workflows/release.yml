name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan secrets with Gitleaks
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern "gitleaks_8.30.1_windows_x64.zip" --output $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          & (Join-Path $toolDir "gitleaks.exe") git --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install trusted Electron runtime
        run: node node_modules/electron/install.js
      - run: npm run test:desktop
      - run: node tests/desktop-mcp-smoke.mjs
      - run: npm run ai:inspect:tools
      - run: npm run test:core
      - run: npm run test:warehouse-sales
      - run: node --test tests/removed-modules.test.mjs tests/warehouse-cleanup.test.mjs
      - run: npm run test:modules
      - name: Require signed official module catalog
        shell: pwsh
        run: |
          if (!(Test-Path desktop/launcher/catalog.json)) { throw "Publish signed module packages before the launcher" }
      - name: Build complete workbench Windows installer
        run: npm run launcher:build
      - name: Verify packaged launcher
        env:
          LAUNCHER_TEST_EXE: dist/launcher-release/win-unpacked/云仓库存同步.exe
        run: npm run test:launcher
      - name: Publish complete GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = node -p "require('./desktop/launcher/package.json').version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes --verify-tag
          }
          $assetNames = @(
            "CloudWarehouseInventorySync-Setup-$version-x64.exe",
            "CloudWarehouseInventorySync-Setup-$version-x64.exe.blockmap",
            'latest.yml'
          )
          $assets = foreach ($name in $assetNames) {
            $file = Join-Path 'dist/launcher-release' $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release artifact: $name" }
            Get-Item -LiteralPath $file
          }
          $existingAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($asset in $assets) {
            # Keep locally verified release files immutable when this tag was
            # created by the local module publication workflow.
            if ($existingAssets -notcontains $asset.Name) {
              gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $($asset.Name)" }
            }
          }
          $remoteAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($required in @(
            "CloudWarehouseInventorySync-Setup-$version-x64.exe",
            "CloudWarehouseInventorySync-Setup-$version-x64.exe.blockmap",
            'latest.yml'
          )) {
            if ($remoteAssets -notcontains $required) { throw "Missing release asset: $required" }
          }
      - name: Upload optional workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/launcher-release/*Setup*.exe
            dist/launcher-release/*.yml
            dist/launcher-release/*.blockmap
