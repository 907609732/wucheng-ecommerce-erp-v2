name: NAS Linux image
run-name: NAS image · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [codex/nas-deployment]
    paths:
      - .github/workflows/nas-image.yml
      - deploy/nas/**
      - server/**
      - shared/**
      - ui/**
      - apps/purchase/**
      - apps/sales/**
      - apps/overview/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Linux data-version recovery
        run: node --test tests/web-data-version-worker.test.mjs
      - name: Prepare and accept Linux release
        shell: bash
        run: |
          set -euo pipefail
          npm_cli="$(npm root -g)/npm/bin/npm-cli.js"
          test -f "$npm_cli"
          npm_execpath="$npm_cli" node server/release.mjs "$RUNNER_TEMP/nas-release"
          node --input-type=module -e "import {verifyRelease} from './server/release.mjs'; const m=verifyRelease(process.env.RUNNER_TEMP+'/nas-release'); if(!m.acceptance?.ok)process.exit(1); console.log(JSON.stringify({accepted:m.accepted,files:m.files.length,acceptance:m.acceptance}));"
      - name: Build and smoke-test image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="wucheng-erp:nas-${GITHUB_SHA}"
          registry_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wucheng-erp-nas:nas-${GITHUB_SHA}"
          docker build --platform linux/amd64 --file deploy/nas/Dockerfile.prebuilt --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --tag "$image" --tag "$registry_image" "$RUNNER_TEMP/nas-release"
          docker run --rm --network none "$image" node --input-type=module -e "import {verifyRelease} from './server/release.mjs'; const m=verifyRelease('/srv/erp'); if(!m.acceptance?.ok)process.exit(1); console.log('image release verified');"
          docker run --rm --network none "$image" sh -c 'command -v cm'
          mkdir -p dist
          docker save --output dist/wucheng-erp-linux-amd64.tar "$image"
          sha256sum dist/wucheng-erp-linux-amd64.tar > dist/SHA256SUMS.txt
          docker image rm "$image" "$registry_image"
          docker load --input dist/wucheng-erp-linux-amd64.tar
          docker run --rm --network none "$image" node --input-type=module -e "import {verifyRelease} from './server/release.mjs'; const m=verifyRelease('/srv/erp'); if(!m.acceptance?.ok)process.exit(1); console.log('saved image release verified');"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$image" "$registry_image"
          docker push "$registry_image"
          printf '%s\n' "$image" > dist/IMAGE.txt
          printf '%s\n' "$registry_image" > dist/REGISTRY-IMAGE.txt
          printf '%s\n' "commit=${GITHUB_SHA}" "run_id=${GITHUB_RUN_ID}" "platform=linux/amd64" > dist/BUILD-INFO.txt
          sed "s|__ERP_IMAGE__|$registry_image|g" deploy/nas/compose-acceptance.yml > dist/compose-acceptance.yml
          sed "s|__ERP_IMAGE__|$registry_image|g" deploy/nas/compose-service.yml > dist/compose-service.yml
          docker compose -f dist/compose-acceptance.yml config --quiet
          docker compose -f dist/compose-service.yml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.sha }}-${{ github.run_id }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
