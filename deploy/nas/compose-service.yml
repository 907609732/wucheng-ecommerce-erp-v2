services:
  erp:
    image: __ERP_IMAGE__
    # The gateway binds 127.0.0.1; host networking lets the NAS Tailscale Serve
    # proxy reach it without exposing a Docker port to the LAN.
    network_mode: host
    volumes:
      - ./config.json:/var/lib/wucheng-erp/config.json:ro
      - ./state:/var/lib/wucheng-erp/state
      - ./data:/var/lib/wucheng-erp/data
      - ./data-version:/var/lib/wucheng-erp/data-version
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:28430/api/workbench/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
